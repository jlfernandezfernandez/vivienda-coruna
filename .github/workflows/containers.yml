name: Containers and Coolify

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare seed database for quality gate
        run: node -e "import { getDatabase } from './scripts/lib/db.mjs'; const db = getDatabase(); db.close();" 
        env:
          DB_PATH: ${{ runner.temp }}/monitor.db
      - run: npm test
      - run: npm run quality
        env:
          DB_PATH: ${{ runner.temp }}/monitor.db
      - run: npm run build
      - name: Validate production Compose
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          OPERATIONS_API_KEY: validation-only-key-with-32-characters
          FIRECRAWL_BASE_URL: http://firecrawl.invalid
        run: docker compose -f compose.production.yml config --quiet
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t vivienda-coruna-backend:test .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t vivienda-coruna-frontend:test .

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/vivienda-coruna-${{ matrix.name }}:sha-${{ github.sha }}

  deploy:
    if: false  # Cloudflare WAF blocks GH Actions runners. Deploy manually from Hermes.
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Require configured production deployment
        run: |
          test -n "$COOLIFY_URL"
          test -n "$COOLIFY_TOKEN"
          test -n "$COOLIFY_SERVICE_UUID"
      - name: Install pinned Coolify CLI
        run: |
          curl -fsSLO https://github.com/coollabsio/coolify-cli/releases/download/v1.6.2/coolify-cli_1.6.2_linux_amd64.tar.gz
          printf '%s  %s\n' '269b131ebeebc41bc8889d3f76fdf2704d0261f3d77414232d700b8255f67ea5' 'coolify-cli_1.6.2_linux_amd64.tar.gz' | sha256sum -c -
          tar -xzf coolify-cli_1.6.2_linux_amd64.tar.gz
          install -m 0755 coolify /usr/local/bin/coolify
      - name: Pin the new immutable image tag and deploy
        run: |
          coolify context add ci "$COOLIFY_URL" "$COOLIFY_TOKEN" --force --default
          coolify service env update "$COOLIFY_SERVICE_UUID" IMAGE_TAG --value "$IMAGE_TAG" --is-literal
          coolify service restart "$COOLIFY_SERVICE_UUID"
      - name: Production smoke test
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 https://vivienda-api.jordixlab.com/ready >/dev/null \
              && curl --fail --silent --show-error --max-time 10 https://vivienda.jordixlab.com/ >/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1
          python3 - <<'PY'
          import json
          import os
          from urllib.request import urlopen

          expected = os.environ['IMAGE_TAG']
          with urlopen('https://vivienda-api.jordixlab.com/health', timeout=10) as response:
              assert json.load(response)['version'] == expected
          with urlopen('https://vivienda.jordixlab.com/', timeout=10) as response:
              assert response.headers['x-app-version'] == expected
          PY
