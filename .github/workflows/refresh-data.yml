name: Refresh housing data

on:
  schedule:
    - cron: '17 8 * * *'
    # Segunda pasada para prensa (Google News es casi real-time): lag máx ~3h.
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-housing-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run refresh
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_BASE_URL: ${{ secrets.FIRECRAWL_BASE_URL }}
      - name: Publish refreshed data
        run: |
          if git diff --quiet -- src/data/monitor.db; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/monitor.db
          git commit -m "chore(data): refresh housing monitor"
          # Retry con rebase para evitar conflictos de DB binaria
          for i in 1 2 3; do
            if git push; then
              echo "Push OK"
              exit 0
            fi
            echo "Push failed (attempt $i), pulling rebase..."
            git pull --rebase --strategy-option theirs origin master || exit 1
          done
          git push || exit 1
